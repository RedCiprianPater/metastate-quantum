services:
  - type: web
    name: metastate-quantum
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: IBM_QUANTUM_CRN
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
