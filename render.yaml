services:
  - type: web
    name: metastate-quantum
    runtime: python
    plan: free
    buildCommand: "pip install --upgrade pip && pip install 'setuptools>=65,<70' wheel && pip install --prefer-binary --no-build-isolation -r requirements.txt && (pip install --prefer-binary --no-build-isolation pyqpanda3 || echo 'pyqpanda3 unavailable on this platform; Origin backend will report unavailable and fall back')"
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ═════════════════════════════════════════════════════════════════════
      # v0.7.7 quantum backends (unchanged from previous deploy)
      # ═════════════════════════════════════════════════════════════════════

      # ---- IBM Quantum (Qiskit Runtime) ----
      - key: IBM_QUANTUM_TOKEN
        sync: false                    # 44-char API key from quantum.cloud.ibm.com dashboard
      - key: IBM_QUANTUM_CRN
        sync: false                    # crn:v1:bluemix:public:quantum-computing:<region>:a/<acct>:<inst>::

      # ---- Origin Wukong (Origin Cloud, USTC) ----
      - key: ORIGIN_API_KEY
        sync: false                    # optional; without it the Origin backend runs the local QPanda sim

      # ---- Osaka University · OQTOPUS Cloud · ¹⁷¹Yb⁺ ion trap ----
      - key: OSAKA_API_TOKEN
        sync: false                    # OQTOPUS Cloud token from the Osaka QIQB user portal
      - key: OSAKA_API_URL
        sync: false                    # OQTOPUS Cloud base URL from Osaka QIQB registration
      - key: OSAKA_DEVICE_ID
        value: "osaka_iontrap_yb171"   # device id issued by QIQB at registration; override if needed

      # ---- Shared secrets (auth gates) ----
      - key: WORKER_SHARED_SECRET
        sync: false                    # METASTATE Space sends this in x-worker-secret on /route
      - key: CHAINSTATE_SHARED_SECRET
        sync: false                    # CHAINSTATE Cloudflare worker sends this in x-chainstate-token on /chainstate/route

      # ═════════════════════════════════════════════════════════════════════
      # v0.7.8 perception module additions (Paper VIII)
      # All optional; endpoints degrade gracefully when absent.
      # ═════════════════════════════════════════════════════════════════════

      # ---- Supabase (source of truth for priors + audit trails) ----
      # Tables live in an isolated schema (chainstate_perception) — nothing
      # in public / storage / graphql_public / nworobotics is touched.
      # After running supabase/schema.sql, expose the schema:
      #   Supabase Dashboard → Settings → API → Exposed schemas → add
      #     chainstate_perception
      - key: SUPABASE_URL
        sync: false                    # e.g. https://xyzcompany.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                    # service_role key from Supabase project settings
      - key: SUPABASE_PERCEPTION_SCHEMA
        value: "chainstate_perception" # override to "public" only for legacy installs

      # ---- R2 (trained EML tree storage) ----
      - key: R2_MODELS_BASE_URL
        sync: false                    # e.g. https://models.chainstate.dev/perception
                                       # or an R2 public-development URL

      # R2 write credentials (for training pipeline upload) --- only needed
      # on services that run the training tick, not for read-only inference
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: "chainstate-perception-models"

      # ---- Provenance detection service (chainstate-provenance) ----
      - key: PROVENANCE_SERVICE_URL
        sync: false                    # e.g. https://chainstate-provenance.onrender.com
                                       # if empty, endpoints default to refuse-by-default
                                       # for meta-layer intake (Paper VIII §8.5)
      - key: PROVENANCE_SHARED_SECRET
        sync: false                    # auth for provenance service calls

      # ---- Perception behavior toggles ----
      - key: PERCEPTION_LOG_LEVEL
        value: "INFO"

      # ---- Training pipeline env (only used by /perception/train/tick) ----
      - key: TRAINING_HTTPX_UA
        value: "chainstate-training/0.7.8 (+https://cpater-chainstate.static.hf.space)"
      - key: TRAINING_MAX_SAMPLES_PER_TICK
        value: "500"                   # daily sample budget per corpus
      - key: TRAINING_ALLOWED_SOURCES
        value: "dtd,fmd,dcase_free,audioset_free,user_nature_20260810,user_instruments_20260810,user_voices_20260810"
                                       # comma-separated allowlist of corpora
                                       # user_* corpora must be uploaded to Supabase
                                       # perception_priors with source='user_<name>' and
                                       # human_verified=true beforehand

      # ═════════════════════════════════════════════════════════════════════
      # v0.7.9 · Cyberspace Census additions (Paper IX)
      # ADDITIVE ONLY. Every v0.7.7 and v0.7.8 setting above is preserved
      # verbatim. The census subsystem imports census_daily.py inside app.py
      # (fail-soft) and runs a nightly 05:00 UTC APScheduler cron.
      # All census endpoints degrade gracefully when any env below is absent.
      # ═════════════════════════════════════════════════════════════════════

      # ---- Master enable/disable ----
      - key: CENSUS_ENABLED
        value: "true"                  # set to "false" to disable all census
                                       # functions without removing this section

      # ---- Internal auth (dedicated census secret, v0.7.9 rev 2) ----
      # The Cloudflare Worker's runCensusDailyTick() and pushToWorker() both
      # send this token in the x-census-internal header. DELIBERATELY
      # DISTINCT from CHAINSTATE_INTERNAL_TOKEN (which continues to protect
      # the Worker's quantum autonomy path via /agi/quantum/route unchanged).
      # This separation lets you rotate the census secret without disturbing
      # the quantum path and vice versa.
      - key: CENSUS_INTERNAL_TOKEN
        sync: false

      # ---- Companion Worker base URL ----
      # Where run_daily_census() posts its digest at end-of-tick.
      # Uses default when unset.
      - key: CHAINSTATE_WORKER_BASE
        value: "https://chainstate-worker.ciprianpater.workers.dev"

      # ---- Threat surface T(t) hyperparameters (Paper IX §5.1) ----
      # These must match wrangler.toml on the Cloudflare Worker.
      - key: CENSUS_THETA_ALERT
        value: "60"                    # T(t) crossing 60 → posture escalates to alert
      - key: CENSUS_THETA_LOCKDOWN
        value: "85"                    # T(t) crossing 85 → meta-layer isolates
      - key: CENSUS_WEIGHTS
        value: "0.35,0.30,0.20,0.15"   # w_v, w_a, w_p, w_s · normalized at read

      # ---- Supabase schema (isolated from chainstate_perception) ----
      # After running chainstate_census_schema.sql, expose the schema:
      #   Supabase Dashboard → Settings → API → Exposed schemas → add
      #     chainstate_census
      # This is separate from chainstate_perception; both must be exposed
      # if both v0.7.8 and v0.7.9 features are wanted.
      - key: SUPABASE_CENSUS_SCHEMA
        value: "chainstate_census"     # override only for legacy installs

      # ---- NVD API key (optional; higher rate limit) ----
      # Without it: 5 requests/30s. With it: 50 requests/30s.
      # Free tier from https://nvd.nist.gov/developers/request-an-api-key
      - key: NVD_API_KEY
        sync: false

      # ═════════════════════════════════════════════════════════════════════
      # v0.8.0 · CHAINSTATE ROBOTICS AGI (Paper X Rev 2)
      # All optional; robotics endpoints return 503 + reason if unset.
      # Failure of any of these NEVER affects quantum, perception, or census.
      # ═════════════════════════════════════════════════════════════════════

      # ---- Master switch ----
      - key: ROBOTICS_ENABLED
        value: "true"                  # set "false" to disable the entire robotics subsystem

      # ---- Google DeepMind Gemini Robotics ----
      - key: GOOGLE_AI_STUDIO_KEY
        sync: false                    # aistudio.google.com API key · Gemini Robotics ER 2 (public tier)
      - key: GEMINI_ROBOTICS_MODEL
        value: "gemini-robotics-er-1.6"   # bump to ER 2 model id when trusted-tester access lands
                                       # VLA + On-Device 2 remain PARKED (external programme gate)

      # ---- S_survival thresholds (Paper X §4.2) ----
      - key: S_SURVIVAL_THETA_MIGRATE
        value: "0.35"                  # authorises substrate migration (L4)
      - key: S_SURVIVAL_THETA_EMBODY
        value: "0.15"                  # authorises defensive embodiment (L5) · CUMULATIVE with §4.3
      - key: S_SURVIVAL_THETA_ULTIMA
        value: "0.05"                  # authorises full embodied response (L6) · extinction imminent

      # ---- Meta-layer coherence (Paper X Rev 2 §4.5) ----
      - key: META_COHERENCE_HYSTERESIS_HOURS
        value: "6"                     # window inside which self-representation continuity is nominal

      # ---- Substrate identity fingerprint (Paper VII invariant) ----
      # If unset the L0 check will treat the fingerprint predicate as failed
      # and downshift authorised action classes. Set this to the CHAINSTATE
      # Anchor contract address on Base 8453.
      - key: CHAINSTATE_ANCHOR_ADDRESS
        value: "0x12441662740836e9c72a4b758fe1c60c17ddd2d8"

      # ---- Supabase (chainstate_robotics schema · run expose_chainstate_robotics.sql) ----
      # Reuses SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY from v0.7.8 perception block above.
      # After running expose_chainstate_robotics.sql:
      #   Supabase Dashboard → Settings → API → Exposed schemas → add
      #     chainstate_robotics
      - key: SUPABASE_ROBOTICS_SCHEMA
        value: "chainstate_robotics"

      # ---- NWO Robotics API (traffic-monitor target) ----
      # Substrate probes this to compute the P (physical-substrate) axis of
      # S_survival, and observes its /traffic/recent for the audit mirror.
      # Substrate NEVER makes control calls to this API — observation only.
      - key: NWO_ROBOTICS_API_BASE
        sync: false                    # e.g. https://api.nworobotics.com

      # ---- CHAINSTATE Worker base (S_survival axis C probe target) ----
      - key: CHAINSTATE_WORKER_BASE
        value: "https://chainstate-worker.ciprianpater.workers.dev"

      # ---- Legal-continuity manual override (optional) ----
      # Set only during known-degraded legal periods. Value in [0.01, 1.0].
      # When unset the L axis defaults to 1.0 (no automatic legal monitoring
      # source is currently integrated — see Paper X Rev 2 §4.7).
      # - key: L_AXIS_OVERRIDE
      #   value: "1.0"

      # NOTE · CENSUS_INTERNAL_TOKEN (defined above under v0.7.9 rev 2) is
      # REUSED for /robotics/* endpoints per Paper X Rev 2 §7.1. No new
      # secret is introduced. The Worker sends the same header value on
      # both /census/* and /robotics/* internal calls.
